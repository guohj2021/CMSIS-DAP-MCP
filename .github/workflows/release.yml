name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            scope: cmsis-dap-mcp-win32-x64
            artifact: cmsis-dap-mcp.exe
          - os: ubuntu-latest
            scope: cmsis-dap-mcp-linux-x64
            artifact: cmsis-dap-mcp
          - os: macos-latest
            scope: cmsis-dap-mcp-darwin-x64
            artifact: cmsis-dap-mcp
    runs-on: ${{ matrix.os }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo build --release
      - name: Stage npm platform package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "npm/platforms/${{ matrix.scope }}/bin"
          cp "target/release/${{ matrix.artifact }}" "npm/platforms/${{ matrix.scope }}/bin/"
          npm --prefix "npm/platforms/${{ matrix.scope }}" pkg set version="$VERSION"
      - name: Publish platform package to npmjs
        if: env.NPM_TOKEN != ''
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="@guohj2021/${{ matrix.scope }}"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd "npm/platforms/${{ matrix.scope }}"
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "already published on npmjs: ${PACKAGE}@${VERSION}"
          else
            npm publish --access public
          fi
      - name: Publish platform package to GitHub Packages
        if: env.GH_TOKEN != ''
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="@guohj2021/${{ matrix.scope }}"
          echo "registry=https://npm.pkg.github.com/" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN}" >> ~/.npmrc
          cd "npm/platforms/${{ matrix.scope }}"
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "already published on GitHub Packages: ${PACKAGE}@${VERSION}"
          else
            npm publish
          fi
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scope }}
          path: target/release/${{ matrix.artifact }}
  release-assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set versions from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix npm pkg set version="$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-win32-x64=$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-linux-x64=$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-darwin-x64=$VERSION"
      - name: Publish meta package to npmjs
        if: env.NPM_TOKEN != ''
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd npm
          if npm view "cmsis-dap-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "already published on npmjs: cmsis-dap-mcp@${VERSION}"
          else
            npm publish --access public
          fi