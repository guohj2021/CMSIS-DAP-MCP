name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            scope: cmsis-dap-mcp-win32-x64
            artifact: cmsis-dap-mcp.exe
            npmdir: npm/platforms
          - os: ubuntu-latest
            scope: cmsis-dap-mcp-linux-x64
            artifact: cmsis-dap-mcp
            npmdir: npm/platforms
          # macos-15-intel is the hosted Intel (x64) macOS runner; using it
          # guarantees a genuine x86_64 darwin artifact for darwin-x64.
          - os: macos-15-intel
            scope: cmsis-dap-mcp-darwin-x64
            artifact: cmsis-dap-mcp
            npmdir: npm/platforms
          # macos-14 is the hosted ARM64 macOS runner.
          - os: macos-14
            scope: cmsis-dap-mcp-darwin-arm64
            artifact: cmsis-dap-mcp
            npmdir: npm/platforms
          - os: ubuntu-24.04-arm
            scope: cmsis-dap-mcp-linux-arm64
            artifact: cmsis-dap-mcp
            npmdir: npm/platforms
          - os: windows-11-arm
            scope: cmsis-dap-mcp-win32-arm64
            artifact: cmsis-dap-mcp.exe
            npmdir: npm/platforms
          - os: windows-latest
            scope: cmsis-dap-cli-win32-x64
            artifact: cmsis-dap-cli.exe
            npmdir: npm-cli/platforms
          - os: ubuntu-latest
            scope: cmsis-dap-cli-linux-x64
            artifact: cmsis-dap-cli
            npmdir: npm-cli/platforms
          - os: macos-15-intel
            scope: cmsis-dap-cli-darwin-x64
            artifact: cmsis-dap-cli
            npmdir: npm-cli/platforms
          - os: macos-14
            scope: cmsis-dap-cli-darwin-arm64
            artifact: cmsis-dap-cli
            npmdir: npm-cli/platforms
          - os: ubuntu-24.04-arm
            scope: cmsis-dap-cli-linux-arm64
            artifact: cmsis-dap-cli
            npmdir: npm-cli/platforms
          - os: windows-11-arm
            scope: cmsis-dap-cli-win32-arm64
            artifact: cmsis-dap-cli.exe
            npmdir: npm-cli/platforms
    runs-on: ${{ matrix.os }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo build --release --workspace
      - name: Stage npm platform package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "${{ matrix.npmdir }}/${{ matrix.scope }}/bin"
          cp "target/release/${{ matrix.artifact }}" "${{ matrix.npmdir }}/${{ matrix.scope }}/bin/"
          npm --prefix "${{ matrix.npmdir }}/${{ matrix.scope }}" pkg set version="$VERSION"
      - name: Publish platform package to npmjs
        if: env.NPM_TOKEN != ''
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="@guohj2021/${{ matrix.scope }}"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd "${{ matrix.npmdir }}/${{ matrix.scope }}"
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "already published on npmjs: ${PACKAGE}@${VERSION}"
          else
            npm publish --access public
          fi
      - name: Publish platform package to GitHub Packages
        if: env.GH_TOKEN != ''
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="@guohj2021/${{ matrix.scope }}"
          echo "registry=https://npm.pkg.github.com/" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN}" >> ~/.npmrc
          cd "${{ matrix.npmdir }}/${{ matrix.scope }}"
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "already published on GitHub Packages: ${PACKAGE}@${VERSION}"
          else
            npm publish
          fi
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scope }}
          path: target/release/${{ matrix.artifact }}
  release-assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename platform binaries
        shell: bash
        run: |
          mkdir -p release
          cp dist/cmsis-dap-mcp-win32-x64/cmsis-dap-mcp.exe release/cmsis-dap-mcp-win32-x64.exe
          cp dist/cmsis-dap-mcp-linux-x64/cmsis-dap-mcp release/cmsis-dap-mcp-linux-x64
          cp dist/cmsis-dap-mcp-darwin-x64/cmsis-dap-mcp release/cmsis-dap-mcp-darwin-x64
          cp dist/cmsis-dap-mcp-win32-arm64/cmsis-dap-mcp.exe release/cmsis-dap-mcp-win32-arm64.exe
          cp dist/cmsis-dap-mcp-linux-arm64/cmsis-dap-mcp release/cmsis-dap-mcp-linux-arm64
          cp dist/cmsis-dap-mcp-darwin-arm64/cmsis-dap-mcp release/cmsis-dap-mcp-darwin-arm64
          cp dist/cmsis-dap-cli-win32-x64/cmsis-dap-cli.exe release/cmsis-dap-cli-win32-x64.exe
          cp dist/cmsis-dap-cli-linux-x64/cmsis-dap-cli release/cmsis-dap-cli-linux-x64
          cp dist/cmsis-dap-cli-darwin-x64/cmsis-dap-cli release/cmsis-dap-cli-darwin-x64
          cp dist/cmsis-dap-cli-win32-arm64/cmsis-dap-cli.exe release/cmsis-dap-cli-win32-arm64.exe
          cp dist/cmsis-dap-cli-linux-arm64/cmsis-dap-cli release/cmsis-dap-cli-linux-arm64
          cp dist/cmsis-dap-cli-darwin-arm64/cmsis-dap-cli release/cmsis-dap-cli-darwin-arm64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set versions from tag (cmsis-dap-mcp)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix npm pkg set version="$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-win32-x64=$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-linux-x64=$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-darwin-x64=$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-win32-arm64=$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-linux-arm64=$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-darwin-arm64=$VERSION"
      - name: Set versions from tag (cmsis-dap-cli)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix npm-cli pkg set version="$VERSION"
          npm --prefix npm-cli pkg set "optionalDependencies.@guohj2021/cmsis-dap-cli-win32-x64=$VERSION"
          npm --prefix npm-cli pkg set "optionalDependencies.@guohj2021/cmsis-dap-cli-linux-x64=$VERSION"
          npm --prefix npm-cli pkg set "optionalDependencies.@guohj2021/cmsis-dap-cli-darwin-x64=$VERSION"
          npm --prefix npm-cli pkg set "optionalDependencies.@guohj2021/cmsis-dap-cli-win32-arm64=$VERSION"
          npm --prefix npm-cli pkg set "optionalDependencies.@guohj2021/cmsis-dap-cli-linux-arm64=$VERSION"
          npm --prefix npm-cli pkg set "optionalDependencies.@guohj2021/cmsis-dap-cli-darwin-arm64=$VERSION"
      - name: Publish cmsis-dap-mcp meta package to npmjs
        if: env.NPM_TOKEN != ''
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd npm
          if npm view "cmsis-dap-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "already published on npmjs: cmsis-dap-mcp@${VERSION}"
          else
            npm publish --access public
          fi
      - name: Publish cmsis-dap-cli meta package to npmjs
        if: env.NPM_TOKEN != ''
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd npm-cli
          if npm view "cmsis-dap-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "already published on npmjs: cmsis-dap-cli@${VERSION}"
          else
            npm publish --access public
          fi
