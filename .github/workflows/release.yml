name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            scope: cmsis-dap-mcp-win32-x64
            artifact: cmsis-dap-mcp.exe
          - os: ubuntu-latest
            scope: cmsis-dap-mcp-linux-x64
            artifact: cmsis-dap-mcp
          - os: macos-latest
            scope: cmsis-dap-mcp-darwin-x64
            artifact: cmsis-dap-mcp
    runs-on: ${{ matrix.os }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Stage npm platform package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "npm/platforms/${{ matrix.scope }}/bin"
          cp "target/release/${{ matrix.artifact }}" "npm/platforms/${{ matrix.scope }}/bin/"
          npm --prefix "npm/platforms/${{ matrix.scope }}" pkg set version="$VERSION"
      - name: Publish npm platform package
        if: env.NPM_TOKEN != ''
        shell: bash
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd "npm/platforms/${{ matrix.scope }}"
          npm publish --access public
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scope }}
          path: target/release/${{ matrix.artifact }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set versions from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix npm pkg set version="$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-win32-x64=$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-linux-x64=$VERSION"
          npm --prefix npm pkg set "optionalDependencies.@guohj2021/cmsis-dap-mcp-darwin-x64=$VERSION"
      - name: Publish meta package
        if: env.NPM_TOKEN != ''
        shell: bash
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd npm
          npm publish --access public
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**