name: Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: cargo install mdbook --locked
      - name: Build English docs
        run: mdbook build docs
      - name: Build Chinese docs
        run: mdbook build docs/zh
      - name: Assemble site (EN at /, ZH at /zh/)
        run: |
          mkdir -p public/zh
          cp -r docs/book/* public/
          cp -r docs/zh/book/* public/zh/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
