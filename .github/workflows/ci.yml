name: CI
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Fast iteration on every push/PR: Windows + Linux. Tag pushes
        # (release) additionally run macOS so each OS family is verified
        # before the release workflow packages the platform binaries.
        os: ${{ fromJSON(github.ref_type == 'tag' && '["windows-latest", "ubuntu-latest", "macos-latest"]' || '["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Fail fast, before the expensive builds: no vendor-specific content may
      # enter the repository (see scripts/check-no-vendor.ps1).
      - name: Vendor content scan
        shell: pwsh
        run: ./scripts/check-no-vendor.ps1
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: "rustfmt,clippy"
      # Build the embedded Web UI so rust-embed always embeds fresh assets.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: web
        run: npm ci && npm run build
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
