name: CI
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Fast iteration on every push/PR: Windows + Linux. Tag pushes
        # (release) additionally run macOS so each OS family is verified
        # before the release workflow packages the platform binaries.
        os: ${{ fromJSON(github.ref_type == 'tag' && '["windows-latest", "ubuntu-latest", "macos-latest"]' || '["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: "rustfmt,clippy"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
