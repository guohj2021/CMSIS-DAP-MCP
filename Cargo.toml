[package]
name = "cmsis-dap-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
probe-rs = "0.32.0"
rmcp = "3.1.2"
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
